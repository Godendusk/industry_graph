<!-- 5. RAG 问答视图 -->
<div id="view-rag" class="absolute inset-0 bg-gray-50 hidden p-6 flex flex-col">
    <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden w-full">
        <div class="p-4 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
            <span class="font-bold text-gray-700"><i class="fas fa-robot text-emerald-500 mr-2"></i>智能问答助手</span>
            <span class="text-xs text-gray-400 bg-white px-2 py-1 rounded border">Model: RAG-Vector-DB</span>
        </div>

        <div id="chat-history" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50/50">
            <div class="flex gap-3 fade-in">
                <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-white text-xs flex-shrink-0">AI</div>
                <div class="bg-white p-3 rounded-lg rounded-tl-none shadow-sm text-sm text-gray-700 border border-gray-100 max-w-[80%] whitespace-pre-wrap">您好！我是基于知识图谱的智能助手。</div>
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-100">
            <form onsubmit="handleRAGSubmit(event)" class="relative">
                <input type="text" id="rag-input"
                    class="w-full bg-gray-100 border border-transparent focus:bg-white focus:border-emerald-500 rounded-lg pl-4 pr-12 py-3 text-sm focus:outline-none transition-all"
                    placeholder="输入您的问题..." autocomplete="off">
                <button type="submit" class="absolute right-2 top-2 p-1.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-md transition shadow-md shadow-emerald-200">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </div>
</div>
