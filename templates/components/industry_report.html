<!-- 产业报告生成视图 -->
<div id="view-industry-report" class="absolute inset-0 bg-gray-50 hidden overflow-hidden">
    <div class="h-full flex flex-col">
        <div class="bg-white border-b border-gray-200 px-8 py-4 flex flex-col gap-4 flex-shrink-0">
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center">
                        <i class="fas fa-file-signature text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">产业报告生成</h2>
                        <div id="report-flow-meta" class="text-xs text-gray-500 mt-1">等待输入报告需求</div>
                    </div>
                </div>
                <div class="flex items-center gap-3 flex-wrap justify-end">
                    <div id="report-flow-stage" class="hidden md:flex items-center gap-2 text-xs text-gray-500">
                        <span class="w-2 h-2 rounded-full bg-gray-300"></span>
                        <span>未开始</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="industry-report-history-select"
                                onchange="loadSelectedIndustryReportHistory()"
                                class="w-44 bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700">
                            <option value="">暂无历史报告</option>
                        </select>
                        <button onclick="saveIndustryReportHistory()" class="bg-white hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-lg text-sm border border-gray-300 flex items-center gap-2">
                            <i class="fas fa-save text-gray-600"></i>
                            保存
                        </button>
                        <button onclick="deleteSelectedIndustryReportHistory()" class="bg-white hover:bg-red-50 text-red-600 px-3 py-2 rounded-lg text-sm border border-red-100 flex items-center gap-2">
                            <i class="fas fa-trash"></i>
                            删除
                        </button>
                    </div>
                    <button onclick="exportIndustryReportMarkdown()" class="bg-white hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-lg text-sm border border-gray-300 flex items-center gap-2">
                        <i class="fas fa-file-arrow-down text-gray-600"></i>
                        导出 MD
                    </button>
                    <button onclick="exportIndustryReportWord()" class="bg-white hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-lg text-sm border border-gray-300 flex items-center gap-2">
                        <i class="fas fa-file-word text-blue-600"></i>
                        导出 Word
                    </button>
                    <button onclick="resetIndustryReportWorkspace()" class="bg-white hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-lg text-sm border border-gray-300 flex items-center gap-2">
                        <i class="fas fa-rotate-left text-gray-500"></i>
                        重置
                    </button>
                </div>
            </div>
            <div id="industry-report-stepper"></div>
        </div>

        <div class="flex-1 min-h-0 overflow-y-auto">
            <div class="p-6 space-y-5">
                <section class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm">
                    <div class="flex items-center justify-between mb-4 gap-3">
                        <div class="font-semibold text-gray-800 flex items-center gap-2">
                            <i class="fas fa-pen-nib text-blue-600"></i>
                            报告需求
                        </div>
                        <span id="report-industry-pill" class="text-xs px-2 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100">人工智能</span>
                    </div>
                    <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 items-start">
                        <div class="xl:col-span-10 space-y-3">
                            <input id="industry-report-title"
                                   class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm font-medium text-gray-800 focus:ring-blue-500 focus:border-blue-500"
                                   value="人工智能产业报告"
                                   placeholder="报告标题">
                            <textarea id="industry-report-prompt"
                                      class="w-full h-24 bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:ring-blue-500 focus:border-blue-500 resize-none"
                                      placeholder="输入报告主题、侧重点、篇幅、分析对象等需求...">请生成一份人工智能产业报告，重点分析政策环境、产业链布局、算力基础设施、大模型、重点企业、应用场景和未来趋势。</textarea>
                        </div>
                        <div class="xl:col-span-2 flex flex-col gap-2">
                            <button id="report-outline-btn"
                                    onclick="generateIndustryReportOutline()"
                                    class="w-full bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                                <i class="fas fa-wand-magic-sparkles"></i>
                                生成大纲
                            </button>
                            <div id="industry-report-status" class="text-xs text-gray-500">等待输入需求</div>
                        </div>
                    </div>
                </section>

                <section class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm space-y-4">
                    <div class="flex items-center justify-between gap-3">
                        <div class="font-semibold text-gray-800 flex items-center gap-2">
                            <i class="fas fa-sitemap text-indigo-600"></i>
                            大纲编辑
                        </div>
                        <div class="flex gap-2">
                            <button onclick="addIndustryReportSection()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs border border-gray-300">
                                <i class="fas fa-plus mr-1"></i>章节
                            </button>
                            <button onclick="prepareIndustryReportTasks()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs">
                                <i class="fas fa-list-check mr-1"></i>确认
                            </button>
                        </div>
                    </div>
                    <div id="industry-report-outline" class="space-y-3">
                        <div class="text-gray-400 text-sm">生成推荐大纲后可编辑</div>
                    </div>
                </section>

                <section class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm space-y-3">
                    <div class="font-semibold text-gray-800 flex items-center gap-2">
                        <i class="fas fa-sliders text-emerald-600"></i>
                        生成参数
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-3">
                        <label class="block">
                            <span class="text-xs font-semibold text-gray-500">检索数量</span>
                            <input id="industry-report-top-k" type="number" min="1" max="20" value="10"
                                   class="mt-1 w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <span class="mt-1 block text-[11px] leading-4 text-gray-500">每个章节/任务检索多少条相关资料。</span>
                        </label>
                        <label class="block">
                            <span class="text-xs font-semibold text-gray-500">并发数</span>
                            <input id="industry-report-workers" type="number" min="1" max="6" value="3"
                                   class="mt-1 w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <span class="mt-1 block text-[11px] leading-4 text-gray-500">生成正文时同时写几个一级标题。</span>
                        </label>
                        <div class="lg:col-span-2 rounded-lg border border-emerald-100 bg-emerald-50 px-3 py-2 text-xs leading-5 text-emerald-800">
                            <div><span class="font-semibold">检索数量</span>越大，参考资料越多，内容可能更充分，但速度会变慢，也可能引入弱相关信息。建议 8-12。</div>
                            <div class="mt-1"><span class="font-semibold">并发数</span>越大，正文生成越快，但更容易出现接口压力、超时或失败。默认 3 比较稳。</div>
                        </div>
                    </div>
                    <button id="report-generate-btn"
                            onclick="startIndustryReportGeneration()"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                        <i class="fas fa-play"></i>
                        开始生成正文
                    </button>
                </section>

                <section class="min-h-0">
                    <section class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm min-h-[560px]">
                        <div class="flex items-center justify-between gap-3 mb-4">
                            <div class="font-semibold text-gray-800 flex items-center gap-2">
                                <i class="fas fa-file-lines text-gray-600"></i>
                                报告正文预览
                            </div>
                            <button onclick="renderIndustryReportPreview()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs border border-gray-300">
                                <i class="fas fa-rotate mr-1"></i>刷新
                            </button>
                        </div>
                        <div id="industry-report-preview" class="space-y-4 text-sm text-gray-800">
                            <div class="border-b border-gray-200 pb-4">
                                <h1 class="text-2xl font-bold text-gray-900 leading-tight">人工智能产业报告</h1>
                            </div>
                            <div class="text-gray-400">暂无正文内容</div>
                        </div>
                    </section>
                </section>
            </div>
        </div>
    </div>

    <div id="industry-report-rewrite-modal" class="hidden absolute inset-0 z-50 bg-gray-900/40 flex items-center justify-center p-6">
        <div class="bg-white rounded-lg shadow-xl border border-gray-200 w-full max-w-7xl max-h-full overflow-hidden flex flex-col">
            <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
                <div>
                    <div class="font-bold text-gray-800">局部内容重写</div>
                    <div id="industry-report-rewrite-meta" class="text-xs text-gray-500 mt-1"></div>
                </div>
                <button onclick="closeIndustryReportRewriteModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4">
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                    <label class="block">
                        <span class="block text-sm font-medium text-gray-700 mb-2">重写要求</span>
                        <textarea id="industry-report-rewrite-prompt" class="w-full h-24 bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm resize-none" placeholder="例如：减少宏观铺陈，突出企业、算力布局和场景落地。"></textarea>
                    </label>
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <div class="text-sm font-medium text-gray-700">可选外部资料</div>
                            <button onclick="recommendIndustryReportMaterials()" class="text-xs text-blue-600 hover:text-blue-700">
                                <i class="fas fa-search mr-1"></i>推荐资料
                            </button>
                        </div>
                        <div id="industry-report-materials" class="space-y-2 text-sm max-h-32 overflow-y-auto border border-gray-200 rounded-lg p-3 bg-gray-50">
                            暂无资料
                        </div>
                    </div>
                </div>
                <button onclick="rewriteIndustryReportSection()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                    <i class="fas fa-rotate mr-2"></i>生成重写内容
                </button>
                <div>
                    <div class="text-sm font-medium text-gray-700 mb-2">新旧内容对比</div>
                    <div id="industry-report-rewrite-preview" class="grid grid-cols-1 gap-3 text-sm items-start">
                        <div class="border border-gray-200 rounded-lg p-3 bg-gray-50 text-gray-500">生成后显示对比</div>
                    </div>
                </div>
            </div>
            <div class="px-5 py-4 border-t border-gray-200 flex items-center justify-end gap-2">
                <button onclick="closeIndustryReportRewriteModal()" class="bg-white hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg text-sm border border-gray-300">关闭</button>
                <button onclick="acceptIndustryReportRewrite()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm">采用新内容</button>
            </div>
        </div>
    </div>
</div>
