<!-- 资讯详情视图 -->
<div id="view-news-detail" class="absolute inset-0 bg-gray-100 hidden flex flex-col">
    
    <!-- 顶部导航栏 -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 flex-shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-4">
            <button onclick="switchView('news-list')" class="flex items-center gap-2 text-blue-600 hover:text-blue-800 transition">
                <i class="fas fa-arrow-left"></i>
                <span>返回行业资讯</span>
            </button>
            <div class="w-px h-6 bg-gray-300"></div>
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-newspaper text-blue-600"></i> 
                <span>资讯详情</span>
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <!-- 可以添加分享、收藏等功能按钮 -->
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-4xl mx-auto">
            <div id="news-detail-content" class="bg-white rounded-xl shadow-lg p-8">
                <!-- 详情内容将通过JavaScript动态填充 -->
                <div class="space-y-6">
                    <!-- 标题和元信息 -->
                    <div class="border-b border-gray-200 pb-4">
                        <h2 class="text-2xl font-bold text-gray-800 mb-3">加载中...</h2>
                        <div class="flex flex-wrap gap-4 text-sm text-gray-600">
                            <div class="flex items-center gap-1">
                                <i class="far fa-calendar-alt"></i>
                                <span>发布日期: 加载中...</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <i class="fas fa-newspaper"></i>
                                <span>来源: 加载中...</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <i class="fas fa-user"></i>
                                <span>作者: 加载中...</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 内容占位符 -->
                    <div class="prose max-w-none">
                        <div class="text-gray-700 leading-relaxed whitespace-pre-wrap">
                            正在加载资讯详情...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
