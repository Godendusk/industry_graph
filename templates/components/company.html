<!-- 企业主页视图 -->
<div id="view-company" class="absolute inset-0 bg-gray-100 hidden flex flex-col">
    
    <!-- 顶部导航栏 -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 flex-shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-4">
            <button onclick="switchView('graph')" class="flex items-center gap-2 text-blue-600 hover:text-blue-800 transition">
                <i class="fas fa-arrow-left"></i>
                <span>返回知识图谱</span>
            </button>
            <div class="w-px h-6 bg-gray-300"></div>
            <h1 id="company-page-title" class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-building text-blue-600"></i> 
                <span id="company-name">企业详情</span>
            </h1>
        </div>
        <div class="flex items-center gap-4">
            
            <button onclick="refreshCompanyData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition">
                <i class="fas fa-sync-alt"></i>
                刷新数据
            </button>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-7xl mx-auto">
            
            <!-- 企业基本信息卡片 -->
            <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                <div class="flex justify-between items-start mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">企业基本信息</h2>
                    <div class="flex gap-2">
                        <span id="company-status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800">正常经营</span>
                        <span id="company-type-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800">民营企业</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- 基本信息列 -->
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">企业名称</label>
                            <div id="company-full-name" class="text-lg font-semibold text-gray-800">--</div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">统一社会信用代码</label>
                            <div id="company-social-credit-code" class="text-base font-mono text-gray-700">--</div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">法定代表人</label>
                            <div id="company-legal-person" class="text-base text-gray-800">--</div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">成立日期</label>
                            <div id="company-establish-date" class="text-base text-gray-800">--</div>
                        </div>
                    </div>
                    
                    <!-- 经营信息列 -->
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">注册资本</label>
                            <div id="company-registered-capital" class="text-lg font-semibold text-gray-800">--</div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">实缴资本</label>
                            <div id="company-paid-in-capital" class="text-base text-gray-800">--</div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">经营状态</label>
                            <div id="company-operating-status" class="text-base text-gray-800">--</div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">所属行业</label>
                            <div id="company-industry" class="text-base text-gray-800">--</div>
                        </div>
                    </div>
                    
                    <!-- 联系信息列 -->
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">注册地址</label>
                            <div id="company-registered-address" class="text-base text-gray-800">--</div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">经营范围</label>
                            <div id="company-business-scope" class="text-base text-gray-800 text-sm max-h-24 overflow-y-auto">--</div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-500 block mb-1">登记机关</label>
                            <div id="company-registration-authority" class="text-base text-gray-800">--</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 企业资讯信息 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">企业资讯</h2>
                    <div class="text-sm text-gray-500">
                        共 <span id="news-count" class="font-bold text-blue-600">0</span> 条资讯
                    </div>
                </div>
                
                <!-- 资讯列表 -->
                <div id="company-news-list" class="space-y-4">
                    <!-- 资讯项模板 -->
                    <div class="news-item-template hidden">
                        <div class="border border-gray-200 rounded-lg p-4 hover:bg-gray-50 transition">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-semibold text-gray-800 text-lg news-title truncate-title" title="资讯标题">资讯标题</h3>
                                <span class="text-sm text-gray-500 news-date">2024-01-01</span>
                            </div>
                            <div class="text-gray-600 mb-3 news-summary truncate-summary" title="资讯摘要内容...">资讯摘要内容...</div>
                            <div class="flex justify-between items-center">
                                <div class="flex gap-2">
                                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded news-tag">标签</span>
                                </div>
                                <button class="text-blue-600 hover:text-blue-800 text-sm font-medium news-detail-btn">
                                    查看详情 <i class="fas fa-chevron-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 资讯列表容器 -->
                    <div id="company-news-items-container" class="space-y-4">
                        <!-- 资讯项会动态添加到这里 -->
                        <div id="company-news-empty-state" class="text-center py-12 text-gray-500">
                            <i class="fas fa-newspaper text-4xl mb-4 opacity-50"></i>
                            <p class="text-lg">暂无企业资讯</p>
                            <p class="text-sm mt-2">点击刷新数据获取最新资讯</p>
                        </div>
                    </div>
                </div>
                
                <!-- 分页控制 -->
                <div id="news-pagination" class="mt-6 flex justify-center items-center gap-2 hidden">
                    <button onclick="prevNewsPage()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-left"></i> 上一页
                    </button>
                    <div class="text-sm text-gray-600">
                        第 <span id="current-page" class="font-bold">1</span> 页 / 共 <span id="total-pages" class="font-bold">1</span> 页
                    </div>
                    <button onclick="nextNewsPage()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                        下一页 <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            

        </div>
    </main>
</div>
